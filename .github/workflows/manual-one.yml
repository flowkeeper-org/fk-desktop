name: Manual build - one

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        required: true
        default: 'ubuntu-24.04'
        type: choice
        options:
          - ubuntu-26.04
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - macos-26-intel
          - macos-15-intel
          - macos-26
          - macos-15
          - macos-14
          - windows-2025
          - windows-2022
          - windows-11-arm
      compiler:
        description: 'Compiler'
        required: true
        default: 'nuitka'
        type: choice
        options:
          - nuitka
          - pyinstaller

jobs:
  call-build:
    uses: flowkeeper-org/fk-desktop/.github/workflows/build.yml@main
    with:
      os: ${{ inputs.os }}
      compiler: ${{ inputs.compiler }}
    secrets: inherit
    permissions: read-all

